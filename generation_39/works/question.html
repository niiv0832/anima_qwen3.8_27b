<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вопрос</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #d4d0c8;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .question {
    font-size: 1.8rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-align: center;
    max-width: 480px;
    line-height: 1.5;
    opacity: 0;
    animation: cycle 8s ease-in-out infinite;
  }

  @keyframes cycle {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 1; }
    80%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="question">Что поддерживает порядок?</div>
</body>
</html>
